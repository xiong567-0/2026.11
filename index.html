<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="微语 · 轻量短文本发布页，写下一句话，留住此刻的想法。" />
  <meta name="theme-color" content="#F5F6FA" />
  <title>微语 · Micro Posts</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%236366F1'/%3E%3Cstop offset='1' stop-color='%237C3AED'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='9' fill='url(%23g)'/%3E%3Cpath d='M10 12.5h12M10 17h8' stroke='white' stroke-width='2.2' stroke-linecap='round'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <a class="skip-link" href="#feed">跳到内容</a>

  <header class="app-header">
    <div class="header-inner">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32" width="20" height="20" fill="none">
            <path d="M15.6 7.6c.7 4 2.9 6.2 6.8 6.9-3.9.7-6.1 2.9-6.8 6.9-.7-4-2.9-6.2-6.8-6.9 3.9-.7 6.1-2.9 6.8-6.9Z" fill="currentColor" />
            <circle cx="23.6" cy="9.4" r="1.5" fill="currentColor" opacity="0.85" />
          </svg>
        </span>
        <span class="brand-text">
          <span class="brand-name">微语</span>
          <span class="brand-sub">Micro Posts</span>
        </span>
      </div>

      <button type="button" class="user-chip" id="user-chip" aria-haspopup="dialog" title="修改昵称">
        <span class="avatar avatar-sm" id="user-avatar" aria-hidden="true">访</span>
        <span class="user-name" id="user-name">访客</span>
        <svg class="user-chevron" viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
          <path d="M4 6.5 8 10.5l4-4" fill="none" stroke="currentColor" stroke-width="1.6"
            stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </button>
    </div>
  </header>

  <main class="shell">
    <!-- 发布区 -->
    <section class="composer" aria-labelledby="composer-title">
      <h1 class="visually-hidden" id="composer-title">发布新内容</h1>
      <div class="avatar avatar-lg" id="composer-avatar" aria-hidden="true">访</div>
      <form class="composer-main" id="composer-form" novalidate>
        <label class="visually-hidden" for="composer-text">内容</label>
        <textarea
          id="composer-text"
          class="composer-input"
          rows="3"
          placeholder="此刻的想法…"
          autocomplete="off"
          spellcheck="false"
          aria-describedby="composer-counter"></textarea>
        <div class="composer-footer">
          <p class="composer-hint" id="composer-hint" aria-live="polite"></p>
          <div class="composer-tools">
            <span class="counter" id="composer-counter">0 / 200</span>
            <button type="submit" class="btn btn-primary" id="publish-btn" disabled>
              <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true">
                <path d="M10 16V5m0 0L5.5 9.5M10 5l4.5 4.5" fill="none" stroke="currentColor"
                  stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" />
              </svg>
              <span>发布</span>
            </button>
          </div>
        </div>
      </form>
    </section>

    <!-- 信息流 -->
    <section class="feed-section" aria-labelledby="feed-title">
      <div class="feed-head">
        <h2 class="feed-title" id="feed-title">最新动态</h2>
        <span class="feed-count" id="feed-count">0 条</span>
      </div>

      <div class="feed" id="feed" aria-live="polite"></div>

      <div class="feed-empty" id="feed-empty">
        <svg class="empty-icon" viewBox="0 0 64 64" width="64" height="64" fill="none" aria-hidden="true">
          <rect x="10" y="14" width="44" height="32" rx="10" stroke="currentColor" stroke-width="2.4" />
          <path d="M20 26h20M20 34h12" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" />
          <circle cx="46" cy="46" r="7" fill="#EEF0F8" stroke="currentColor" stroke-width="2.4" />
        </svg>
        <p class="empty-title">还没有内容</p>
        <p class="empty-desc">在顶部写下第一条想法吧</p>
      </div>
    </section>
  </main>

  <footer class="app-footer">
    <p>内容仅保存在本机浏览器 · 微语</p>
  </footer>

  <!-- 昵称弹窗 -->
  <div class="modal" id="nickname-modal" hidden>
    <div class="modal-backdrop" data-close="1"></div>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="nickname-title">
      <h2 class="modal-title" id="nickname-title">设置昵称</h2>
      <p class="modal-desc">昵称只保存在这台设备的浏览器里。</p>
      <label class="visually-hidden" for="nickname-input">昵称</label>
      <input
        type="text"
        class="modal-input"
        id="nickname-input"
        maxlength="16"
        placeholder="输入你的昵称"
        autocomplete="off" />
      <p class="modal-error" id="nickname-error" aria-live="polite"></p>
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" data-close="1">取消</button>
        <button type="button" class="btn btn-primary" id="nickname-save">保存</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="js/app.js"></script>
</body>
</html>
